services:
  mpct:
    build: .
    image: mpct:latest
    container_name: mpct
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # Bound to localhost only: the Cloudflare tunnel reaches it, the LAN/internet doesn't.
    # If cloudflared runs in Docker on a shared network, you can drop `ports` and point
    # the tunnel at http://mpct:8000 instead.
    ports:
      - "127.0.0.1:${MPCT_PORT:-8010}:8000"
