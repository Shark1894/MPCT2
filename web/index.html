<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1f27" />
    <title>MPCT</title>
    <link rel="icon" type="image/png" sizes="32x32" href="__ASSETS__/img/icon-32.png" />
    <link rel="apple-touch-icon" href="__ASSETS__/img/icon-180.png" />
    <link rel="stylesheet" href="__ASSETS__/vendor/chessground/chessground.base.css" />
    <link rel="stylesheet" href="__ASSETS__/vendor/chessground/chessground.brown.css" />
    <link rel="stylesheet" href="__ASSETS__/vendor/chessground/chessground.cburnett.css" />
    <link rel="stylesheet" href="__ASSETS__/css/app.css" />
    <script type="module" src="__ASSETS__/js/main.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <img src="__ASSETS__/img/icon-32.png" alt="" width="24" height="24" />
        <span>MPCT</span>
      </a>
      <nav class="views" aria-label="View">
        <button id="view-board" type="button" class="view-tab" aria-pressed="true">Board</button>
        <button id="view-dashboard" type="button" class="view-tab" aria-pressed="false">Dashboard</button>
      </nav>
      <span id="mode-badge" class="mode-badge" hidden>Training</span>
    </header>

    <!-- Order matters on phones (single column): board, controls, repertoire, moves, tools.
         Wider screens place the same sections with CSS grid areas. -->
    <main class="layout">
      <section class="board-area" aria-label="Chess board">
        <div class="board-wrap">
          <div id="board"></div>
          <div id="promo" class="promo" hidden></div>
        </div>
      </section>

      <section class="panel controls" aria-label="Position and navigation">
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <div class="nav" role="group" aria-label="Move navigation">
          <button id="nav-start" type="button" title="Start (Down / Home)" aria-label="Go to start">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z" /></svg>
          </button>
          <button id="nav-back" type="button" title="Back (Left arrow)" aria-label="Previous move">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14L6 12z" /></svg>
          </button>
          <button id="nav-forward" type="button" title="Forward (Right arrow)" aria-label="Next move">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14l11-7z" /></svg>
          </button>
          <button id="nav-end" type="button" title="End (Up / End)" aria-label="Go to end">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z" /></svg>
          </button>
        </div>
      </section>

      <section class="panel repertoire" aria-label="Repertoire">
        <div id="training" class="training" hidden>
          <div class="train-head">
            <h2 id="train-title">Training</h2>
            <button id="train-stop" type="button" class="small">Stop</button>
          </div>
          <p id="train-progress" class="meta"></p>
          <p id="train-message" class="train-message" aria-live="polite"></p>
          <p id="train-comments-note" class="train-comments-note" hidden>
            <span id="train-comments-note-text"></span>
            <button id="train-comments-show" type="button" class="small">Show comments</button>
          </p>
          <div id="train-end" class="train-end" hidden>
            <p id="train-result" class="train-result" aria-live="polite"></p>
            <div class="train-end-actions">
              <button id="train-next" type="button" class="primary">Next line</button>
              <button id="train-retry" type="button" title="Practise this line again (doesn't change the schedule)">Retry</button>
            </div>
          </div>
          <div id="train-summary" class="train-summary" hidden>
            <p id="train-summary-text"></p>
            <button id="train-done" type="button" class="primary">Done</button>
          </div>
        </div>

        <div id="rep-build" class="rep-build">
          <div class="picker">
            <label for="rep-select">Repertoire</label>
            <div class="select-row">
              <select id="rep-select"></select>
              <button id="rep-new" type="button" class="icon-btn" title="New repertoire" aria-label="New repertoire">+</button>
            </div>
          </div>
          <div class="picker">
            <label for="opening-select">Opening</label>
            <div class="select-row">
              <select id="opening-select"></select>
              <button id="opening-new" type="button" class="icon-btn" title="New opening" aria-label="New opening">+</button>
            </div>
            <p id="opening-info" class="meta"></p>
          </div>
          <div id="train-tag-box" class="picker" hidden>
            <label for="train-tag">Lines</label>
            <select id="train-tag"></select>
          </div>
          <div class="train-actions">
            <button id="train-due" type="button" class="primary">Train due</button>
            <button id="train-all" type="button">Train all</button>
          </div>
          <details class="manage">
            <summary>Manage repertoire and opening</summary>
            <div class="manage-grid">
              <button id="rep-rename" type="button">Rename repertoire</button>
              <button id="rep-delete" type="button" class="danger-outline">Delete repertoire</button>
              <button id="opening-edit" type="button">Edit opening</button>
              <button id="opening-delete" type="button" class="danger-outline">Delete opening</button>
            </div>
          </details>

          <div class="explorer-box">
            <h2>Repertoire moves</h2>
            <div id="explorer" class="explorer"></div>
            <div class="line-actions">
              <button id="line-add" type="button" title="Save the moves up to this position as a line">Add line</button>
              <button id="line-delete" type="button" title="Delete every line through this position">Delete line</button>
            </div>
          </div>

          <div class="branches-box">
            <h2>Branches</h2>
            <div id="branch-path" class="branch-path"></div>
            <div class="branch-actions">
              <button id="tag-add" type="button" class="small">Tag this position</button>
              <button id="tag-rename" type="button" class="small" hidden>Rename tag</button>
              <button id="tag-delete" type="button" class="small danger-outline" hidden>Remove tag</button>
            </div>
          </div>
        </div>

        <div id="comments" class="comments">
          <label for="comment-current">Comment <span id="comment-status" class="comment-status"></span></label>
          <textarea id="comment-current" rows="3" placeholder="Notes on this position"></textarea>
          <div id="comment-previous-box" hidden>
            <label for="comment-previous">Previous position</label>
            <textarea id="comment-previous" rows="2" readonly placeholder="No comment"></textarea>
          </div>
        </div>
        <p id="rep-error" class="panel-error" hidden></p>
      </section>

      <section class="panel history" aria-label="Moves">
        <div id="moves" class="moves"></div>
      </section>

      <section class="panel tools" aria-label="Board tools">
        <div class="tool-buttons">
          <button id="btn-new" type="button">New board</button>
          <button id="btn-flip" type="button" title="Flip board (F)">Flip board</button>
        </div>
        <div class="fen-box">
          <label for="fen">FEN</label>
          <input id="fen" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" />
          <div class="fen-actions">
            <button id="btn-fen-load" type="button">Load FEN</button>
            <button id="btn-fen-copy" type="button">Copy FEN</button>
          </div>
          <p id="fen-msg" class="fen-msg" aria-live="polite"></p>
        </div>
      </section>
    </main>

    <main id="dashboard" class="dashboard" hidden>
      <div class="dash-head">
        <div class="dash-title">
          <label for="dash-opening" class="sr-only">Opening</label>
          <select id="dash-opening"></select>
          <label for="dash-tag" class="sr-only">Branch</label>
          <select id="dash-tag" class="dash-tag" hidden></select>
          <span id="dash-color" class="meta"></span>
        </div>
        <div class="dash-buttons">
          <button id="dash-train-due" type="button" class="primary">Train due</button>
          <button id="dash-train-all" type="button">Train all</button>
          <details id="dash-menu" class="menu">
            <summary>More</summary>
            <div class="menu-list">
              <button id="dash-reset-all" type="button">Reset all lines</button>
              <button id="dash-delete-all" type="button" class="danger-outline">Delete all lines</button>
              <button id="dash-delete-opening" type="button" class="danger-outline">Delete opening</button>
            </div>
          </details>
        </div>
      </div>

      <div class="dash-stats">
        <div class="stat"><span class="stat-label">Lines</span><span id="stat-lines" class="stat-value">—</span></div>
        <div class="stat"><span class="stat-label">Due now</span><span id="stat-due" class="stat-value">—</span></div>
        <div class="stat"><span class="stat-label">Next review</span><span id="stat-next" class="stat-value">—</span></div>
        <div class="stat"><span class="stat-label">Reviews</span><span id="stat-reviews" class="stat-value">—</span></div>
        <div class="stat"><span class="stat-label">Accuracy</span><span id="stat-accuracy" class="stat-value">—</span></div>
      </div>

      <div class="dash-table">
        <div class="dash-line dash-header" aria-hidden="true">
          <div>Line</div><div>Next review</div><div>Streak</div><div>Last 5</div><div></div>
        </div>
        <div id="dash-lines"></div>
        <p id="dash-empty" class="dash-empty" hidden></p>
      </div>
    </main>
  </body>
</html>
